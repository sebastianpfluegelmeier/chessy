name: Deploy to GitHub Pages

# Builds the TypeScript and publishes the site to GitHub Pages.
# One-time repo setup: Settings → Pages → Build and deployment → Source =
# "GitHub Actions".

on:
  push:
    branches:
      - claude/game-prototype-uq28pq
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Assemble static site
        run: |
          mkdir -p _site/dist
          cp index.html style.css favicon.svg _site/
          cp -r dist/* _site/dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
